<header class="topbar">
  <span class="brand">Mesa de Solicitudes</span>
  @if (auth.user(); as user) {
    <div class="session">
      <span>
        <strong>{{ user.name }}</strong>
        <span class="muted">
          · {{ user.tenantName }} · {{ user.role === 'ANALYST' ? 'Analista' : 'Filial' }}
        </span>
      </span>
      <button type="button" class="btn" (click)="auth.logout()">Cerrar sesión</button>
    </div>
  }
</header>
<main class="container">
  <router-outlet />
</main>
